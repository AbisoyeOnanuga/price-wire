<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Price Wire — electronics resale pricing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style.css" />
    <script>
      (function () {
        var t = localStorage.getItem("pricewire-theme");
        if (t === "light" || t === "dark") {
          document.documentElement.setAttribute("data-theme", t);
        }
      })();
    </script>
  </head>
  <body>
    <div class="notebook-bg" aria-hidden="true"></div>
    <div class="grid-noise" aria-hidden="true"></div>
    <main class="shell">
      <div class="top-bar">
        <span class="wordmark">Price Wire</span>
        <button
          type="button"
          id="theme-toggle"
          class="theme-toggle"
          aria-label="Toggle light and dark theme"
        >
          <span class="theme-toggle-label">Theme</span>
        </button>
      </div>

      <header class="hero">
        <div class="hero-copy">
          <h1>Price <em>Wire</em></h1>
          <p class="lede">
            Comp-backed list price plus a five-minute draft for used
            electronics—title, condition copy, and description. Photos, shipping,
            and marketplace forms stay on the site you sell on.
          </p>
        </div>
        <figure class="sample-panel" id="sample-panel">
          <figcaption>
            <strong>Example sales (demo)</strong>
            <span
              >Illustrative sold prices from our sample dataset—not a live feed.
              Your quote matches your title and condition.</span
            >
          </figcaption>
          <ul class="sample-list">
            <li class="sample-row" data-price="235">
              <span class="tag">Headphones</span>
              <span class="price demo-price">$235</span>
              <span class="muted">eBay · sold in 4 days</span>
            </li>
            <li class="sample-row" data-price="315">
              <span class="tag">Phone</span>
              <span class="price demo-price">$315</span>
              <span class="muted">Marketplace · 5 days</span>
            </li>
            <li class="sample-row" data-price="435">
              <span class="tag">Console</span>
              <span class="price demo-price">$435</span>
              <span class="muted">eBay · 8 days</span>
            </li>
          </ul>
        </figure>
      </header>

      <form id="quote-form" class="card panel-form">
        <div class="form-head">
          <h2>New listing</h2>
          <p id="integration-status" class="status-line" aria-live="polite"></p>
        </div>
        <label>
          What are you selling?
          <span class="label-helper"
            >Electronics only for now—phones, consoles, headphones, laptops. Use
            the words buyers search: brand, model, color, storage, unlocked.</span
          >
          <input
            id="title"
            name="title"
            required
            autocomplete="off"
            placeholder="Sony WH-1000XM5 black — light wear, includes case"
          />
        </label>
        <label>
          Condition
          <span class="label-helper"
            >Pick the bucket that matches how you will list on eBay or similar.
            Anything that is not sealed-new needs a short condition story below.</span
          >
          <select id="condition" name="condition" aria-describedby="condition-hint">
            <option value="new">New (sealed)</option>
            <option value="open_box">Open box</option>
            <option value="used" selected>Used</option>
            <option value="refurbished">Refurbished</option>
            <option value="for_parts">For parts / not working</option>
          </select>
          <span id="condition-hint" class="field-hint"></span>
        </label>
        <label id="condition-detail-wrap" class="condition-detail-wrap hidden">
          Condition details
          <span class="label-helper"
            >Required for open box, used, refurbished, and for-parts items. This
            text feeds your listing description—scratches, battery %, missing
            parts, what is in the box.</span
          >
          <textarea
            id="condition-detail"
            name="condition_detail"
            rows="4"
            placeholder="Light scuffs on the cups, battery holds ~18 hrs, includes USB-C cable and case. No original box."
          ></textarea>
        </label>
        <button type="submit" id="submit-btn">
          <span class="btn-label">Get price &amp; listing draft</span>
        </button>
      </form>

      <section id="results" class="card panel-results hidden" aria-live="polite"></section>
    </main>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
