<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Price Wire — electronics resale pricing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style.css" />
    <script>
      (function () {
        var t = localStorage.getItem("pricewire-theme");
        if (t === "light" || t === "dark") {
          document.documentElement.setAttribute("data-theme", t);
        }
      })();
    </script>
  </head>
  <body>
    <div class="grid-noise" aria-hidden="true"></div>
    <main class="shell">
      <div class="top-bar">
        <span class="wordmark">Price Wire</span>
        <button
          type="button"
          id="theme-toggle"
          class="theme-toggle"
          aria-label="Toggle light and dark theme"
        >
          <span class="theme-toggle-label">Theme</span>
        </button>
      </div>

      <header class="hero">
        <div class="hero-copy">
          <h1>Price <em>Wire</em></h1>
          <p class="lede">
            Research a fair list price from similar sales, then draft a
            sellable title and condition-led description in minutes—finish
            photos, price, and shipping in the marketplace UI.
          </p>
        </div>
        <figure class="sample-panel">
          <figcaption>
            <strong>Example sales (demo)</strong>
            <span
              >Illustrative prices from our sample dataset—not a live feed. Your
              results use sales matched to your item.</span
            >
          </figcaption>
          <ul class="sample-list">
            <li>
              <span class="tag">Headphones</span>
              <span class="price">$235</span>
              <span class="muted">eBay · sold in 4 days</span>
            </li>
            <li>
              <span class="tag">Phone</span>
              <span class="price">$315</span>
              <span class="muted">Marketplace · 5 days</span>
            </li>
            <li>
              <span class="tag">Console</span>
              <span class="price">$435</span>
              <span class="muted">eBay · 8 days</span>
            </li>
          </ul>
        </figure>
      </header>

      <form id="quote-form" class="card panel-form">
        <div class="form-head">
          <h2>New listing</h2>
          <p id="integration-status" class="status-line" aria-live="polite"></p>
        </div>
        <label>
          What are you selling?
          <input
            id="title"
            name="title"
            required
            autocomplete="off"
            placeholder="Sony WH-1000XM5 black like new"
          />
        </label>
        <label>
          Condition
          <select id="condition" name="condition" aria-describedby="condition-hint">
            <option value="new_sealed">New — sealed in box</option>
            <option value="new_open_box">New — open box</option>
            <option value="like_new">Like new</option>
            <option value="excellent">Excellent</option>
            <option value="very_good">Very good</option>
            <option value="good" selected>Good</option>
            <option value="acceptable">Acceptable</option>
            <option value="fair">Fair</option>
            <option value="poor">Poor</option>
            <option value="for_parts">For parts / not working</option>
            <option value="manufacturer_refurbished">Manufacturer refurbished</option>
            <option value="seller_refurbished">Seller refurbished</option>
          </select>
          <span id="condition-hint" class="field-hint"></span>
        </label>
        <label id="condition-detail-wrap" class="condition-detail-wrap hidden">
          Condition details
          <textarea
            id="condition-detail"
            name="condition_detail"
            rows="3"
            placeholder="Scratches on corner, battery health 87%, includes original box but no cable…"
          ></textarea>
          <span class="field-hint"
            >Used in your listing description. Helps buyers trust the price—especially for used
            items.</span
          >
        </label>
        <button type="submit" id="submit-btn">
          <span class="btn-label">Get price &amp; listing draft</span>
        </button>
      </form>

      <section id="results" class="card panel-results hidden" aria-live="polite"></section>
    </main>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
