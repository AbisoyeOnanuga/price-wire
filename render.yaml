services:
  - type: web
    name: price-wire
    runtime: node
    rootDir: .
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SERPAPI_KEY
        sync: false
      - key: TABPFN_API_KEY
        sync: false
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false
      - key: OLLAMA_BASE_URL
        sync: false
      - key: OLLAMA_ENABLED
        sync: false
      - key: GEMMA_MODEL
        sync: false
      - key: OLLAMA_FIRST
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: QUOTE_RATE_LIMIT
        value: "8"
      - key: QUOTE_DAILY_CAP
        value: "30"
      # Library search returns at most 5 rows; 6 = always fetch live listings when SERPAPI_KEY is set
      - key: SERP_MIN_LOCAL_COMPS
        value: "6"
